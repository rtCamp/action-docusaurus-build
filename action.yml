name: Build Docusaurus documentation
description: Build consumer Markdown with shared branding defaults.
inputs:
  source-directory:
    description: Project directory relative to the consumer checkout.
    default: '.'
  docs-directory:
    description: Markdown directory relative to source-directory; index.md is the homepage.
    default: docs
  site-title:
    description: Site title; empty uses the consumer repository name.
    default: ''
  site-config:
    description: Optional branding JSON file relative to source-directory.
    default: ''
  site-url:
    description: Site origin; empty uses https://OWNER.github.io.
    default: ''
  base-url:
    description: Site path; empty uses the consumer repository path.
    default: ''
  sidebar:
    description: Optional JSON array of Docusaurus sidebar items; empty generates it from docs.
    default: ''
  node-version:
    description: Node.js version for the builder; defaults to the latest LTS (minimum 22).
    default: 'lts/*'
outputs:
  build-directory:
    description: Absolute path to the built site on the current runner.
    value: ${{ steps.build.outputs.build-directory }}
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # Remote action lockfiles live outside the checkout, beyond setup-node's cache hashing scope.
        package-manager-cache: false

    - name: Install builder dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-fund

    - name: Build static documentation
      id: build
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        DOCS_DIRECTORY: ${{ inputs.docs-directory }}
        SITE_TITLE: ${{ inputs.site-title }}
        SITE_CONFIG: ${{ inputs.site-config }}
        SITE_URL: ${{ inputs.site-url }}
        BASE_URL: ${{ inputs.base-url }}
        SIDEBAR: ${{ inputs.sidebar }}
        SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      run: node build-action.mjs
