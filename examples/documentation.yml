name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/documentation.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/documentation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact-name: ${{ steps.docs.outputs.artifact-name }}
    steps:
      - name: Checkout documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Pages URL
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and upload documentation
        id: docs
        uses: rtCamp/action-docusaurus-build@v1
        with:
          site-url: ${{ steps.pages.outputs.origin }}
          base-url: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_path) || '' }}

  deploy:
    name: Deploy documentation
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: documentation-pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Skip superseded builds
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          latest=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits" -f sha="$SOURCE_BRANCH" -f per_page=1 --jq '.[0].sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment: the source branch has advanced.'
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
