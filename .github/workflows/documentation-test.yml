name: Test documentation builder

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # These tests use Node built-ins only; installing the Docusaurus dependency tree is unnecessary.
  unit-tests:
    name: Test documentation tooling
    runs-on: ["self-hosted"]
    steps:
      - name: Checkout builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Test builder
        run: npm test

  documentation:
    name: Build branded documentation fixture
    runs-on: ["self-hosted", "high-performance"]
    steps:
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fixture with the local action
        id: docs
        uses: ./
        with:
          source-directory: fixture
          site-config: branding.json
      - name: Verify published assets
        shell: bash
        env:
          BUILD_DIRECTORY: ${{ steps.docs.outputs.build-directory }}
        run: |
          test -f "$BUILD_DIRECTORY/index.html"
          test -f "$BUILD_DIRECTORY/img/logo.svg"
